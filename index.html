<!DOCTYPE html>
<html lang="id" data-theme="mono">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#fafafa" />
<meta name="description" content="Sharing-it — editor foto ringan dengan feed publik." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Sharing-it" />
<title>Sharing-it</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display&family=Lora:ital,wght@0,400;1,400&family=Bebas+Neue&family=Caveat:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#fafafa; --surface:#ffffff; --surface-2:#f5f5f5; --surface-3:#ededed;
  --text:#171717; --text-2:#525252; --text-3:#a3a3a3;
  --border:#e5e5e5; --border-2:#d4d4d4;
  --accent:#171717; --accent-fg:#fafafa; --accent-soft:#f0f0f0;
  --danger:#dc2626;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 4px 12px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.03);
  --shadow-lg:0 12px 32px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.05);
  --radius:10px; --radius-sm:8px; --radius-lg:14px;
  --s:1;
}
html[data-theme="pink"]{
  --bg:#fdf7fa; --surface:#ffffff; --surface-2:#fbeef4; --surface-3:#f5dde8;
  --text:#3f1d2c; --text-2:#7a5468; --text-3:#b895a6;
  --border:#f0dae4; --border-2:#e5c4d4;
  --accent:#be185d; --accent-fg:#ffffff; --accent-soft:#fbe7f0;
  --danger:#dc2626;
}
html[data-theme="sky"]{
  --bg:#f6fafe; --surface:#ffffff; --surface-2:#eef6fc; --surface-3:#dcecf8;
  --text:#0f2b42; --text-2:#3d5a75; --text-3:#8ba3b8;
  --border:#d9e8f3; --border-2:#bcd4e6;
  --accent:#0369a1; --accent-fg:#ffffff; --accent-soft:#e4f0fa;
  --danger:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);
  overflow:hidden;overscroll-behavior:none;
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv02","cv03","cv04","cv11";
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
input,textarea{background:none;border:0;outline:none;}
.icon{display:inline-block;vertical-align:middle;flex:0 0 auto;}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}

#app{position:fixed;inset:0;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg);}
.screen.active{display:flex;}

/* ============ HOME ============ */
.home{
  flex:1;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  max-width:560px;width:100%;margin:0 auto;
}
.home-top{display:flex;flex-direction:column;gap:20px;padding-top:24px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:var(--accent-fg);
  box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:20px;height:20px;}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
.brand-tag{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
  color:var(--text-3);padding:2px 6px;border:1px solid var(--border);
  border-radius:5px;margin-left:2px;
}
.hero{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.hero h1{
  margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-0.03em;
  color:var(--text);max-width:16ch;
}
.hero p{margin:0;color:var(--text-2);font-size:15px;line-height:1.55;max-width:38ch;}
.home-bottom{display:flex;flex-direction:column;gap:16px;}
.actions{display:flex;flex-direction:column;gap:8px;}
.meta-row{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:16px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text-3);
}
.theme-switch{
  display:inline-flex;align-items:center;gap:2px;padding:3px;
  background:var(--surface-2);border-radius:8px;border:1px solid var(--border);
}
.theme-switch button{
  width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:background .15s,color .15s;
}
.theme-switch button:hover{color:var(--text-2);}
.theme-switch button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs);}
.theme-switch .sw-dot{width:12px;height:12px;border-radius:3px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 16px;border-radius:9px;
  font-size:14px;font-weight:500;letter-spacing:-0.005em;
  transition:background .15s,border-color .15s,color .15s,transform .1s,box-shadow .15s;
  user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-xs);}
.btn-primary:hover{box-shadow:var(--shadow-sm);}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border-2);}
.btn-outline:hover{background:var(--surface-2);}
.btn-ghost{color:var(--text-2);height:36px;padding:0 12px;font-size:13px;}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-wide{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* ============ TOPBAR ============ */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  flex:0 0 auto;border-bottom:1px solid var(--border);
  background:var(--bg);
}
.topbar h2{
  margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em;
  flex:1;text-align:center;
}
.icon-btn{
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn:active{background:var(--surface-3);}
.icon-btn.placeholder{visibility:hidden;pointer-events:none;}

/* ============ FEED ============ */
.feed-head{
  padding:16px 16px 12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:640px;width:100%;margin:0 auto;
}
.feed-head .title{
  font-size:12px;font-weight:500;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.08em;
}
.feed-scroll{
  flex:1;min-height:0;overflow-y:auto;
  padding:0 16px calc(32px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.feed-list{
  display:flex;flex-direction:column;gap:12px;
  max-width:640px;width:100%;margin:0 auto;
}

.post{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;
  transition:border-color .2s,box-shadow .2s;
}
@media(hover:hover){
  .post:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm);}
}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.avatar{
  width:32px;height:32px;border-radius:8px;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;letter-spacing:-0.01em;
}
.post-info{flex:1;min-width:0;}
.post-author{font-size:13px;font-weight:500;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.post-time{font-size:11px;color:var(--text-3);margin-top:2px;}
.post-title{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-0.015em;line-height:1.35;word-break:break-word;}
.post-desc{margin:0 0 12px;font-size:13.5px;color:var(--text-2);line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.post-img{
  width:100%;height:auto;display:block;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);
}
.post-actions{display:flex;gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.act{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:7px;
  font-size:12.5px;font-weight:500;color:var(--text-2);
  transition:background .15s,color .15s;
}
.act:hover{background:var(--surface-2);color:var(--text);}
.act:active{background:var(--surface-3);}
.act .num{font-family:'JetBrains Mono',monospace;font-size:12px;}
.act.liked{color:var(--accent);}
.act.liked .ico-heart{fill:currentColor;}
.act .ico-heart{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.act.liked .ico-heart{transform:scale(1.15);}
.act[disabled]{opacity:.5;cursor:not-allowed;}

.comments{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.comments.open{display:block;}
.c-list{display:flex;flex-direction:column;gap:12px;max-height:280px;overflow-y:auto;margin-bottom:12px;}
.c-item{display:flex;gap:9px;align-items:flex-start;}
.c-ava{
  width:24px;height:24px;border-radius:6px;flex:0 0 auto;
  background:var(--surface-2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
}
.c-body{flex:1;font-size:13px;line-height:1.5;color:var(--text-2);word-break:break-word;padding-top:2px;}
.c-name{font-weight:500;color:var(--text);margin-right:6px;font-size:12.5px;}
.c-empty{font-size:12px;color:var(--text-3);padding:4px 0;}
.c-form{display:flex;gap:6px;}
.c-form input{
  flex:1;height:36px;padding:0 12px;border:1px solid var(--border-2);
  border-radius:8px;font-size:13px;background:var(--surface);
  transition:border-color .15s,box-shadow .15s;min-width:0;
}
.c-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.c-form button{
  height:36px;padding:0 12px;border-radius:8px;
  background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
.c-form button:disabled{opacity:.4;cursor:not-allowed;}

.empty{
  text-align:center;padding:56px 20px;color:var(--text-3);
  max-width:360px;margin:0 auto;
}
.empty-icon{
  width:44px;height:44px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;color:var(--text-3);
}
.empty h3{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--text-2);}
.empty p{margin:0;font-size:13px;line-height:1.5;}

.skel{
  height:260px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.skel::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--surface-2),transparent);
  animation:shimmer 1.6s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

/* ============ EDITOR ============ */
.editor-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.stage-wrap{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden;background:var(--surface-2);
}
.stage-outer{position:relative;box-shadow:var(--shadow-lg);}
.stage{
  position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;
  border-radius:4px;background:#fff;
}
.el{position:absolute;transform-origin:center center;touch-action:none;cursor:move;user-select:none;}
.el.selected{outline:calc(1.5px / var(--s)) solid var(--accent);outline-offset:0;}
.el img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;border-radius:inherit;}
.el .txt{
  width:100%;word-wrap:break-word;overflow-wrap:break-word;
  white-space:pre-wrap;line-height:1.2;pointer-events:none;
}
.handle{
  position:absolute;width:calc(14px / var(--s));height:calc(14px / var(--s));
  background:#fff;border:calc(1.5px / var(--s)) solid var(--accent);
  border-radius:50%;display:none;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.el.selected .handle{display:block;}
.h-tl{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize;}
.h-tr{left:100%;top:0;transform:translate(-50%,-50%);cursor:nesw-resize;}
.h-bl{left:0;top:100%;transform:translate(-50%,-50%);cursor:nesw-resize;}
.h-br{left:100%;top:100%;transform:translate(-50%,-50%);cursor:nwse-resize;}
.h-l{left:0;top:50%;transform:translate(-50%,-50%);cursor:ew-resize;}
.h-r{left:100%;top:50%;transform:translate(-50%,-50%);cursor:ew-resize;}
.h-rot{
  left:50%;top:0;transform:translate(-50%,-50%) translateY(calc(-30px / var(--s)));
  cursor:grab;border-radius:50%;
}
.h-rot::after{
  content:"";position:absolute;left:50%;top:100%;
  width:calc(1.5px / var(--s));height:calc(24px / var(--s));
  background:var(--accent);transform:translateX(-50%);
}
.tool-panel{
  background:var(--surface);border-top:1px solid var(--border);
  padding:14px 16px;max-height:44vh;overflow-y:auto;display:none;flex:0 0 auto;
}
.tool-panel.open{display:block;}
.tool-panel-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.panel-label{
  font-size:11px;font-weight:500;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.08em;
}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.row-label{
  font-size:12px;font-weight:500;color:var(--text-2);
  min-width:64px;display:flex;align-items:center;gap:6px;
}
.chip{
  height:30px;padding:0 12px;border-radius:7px;
  font-size:12.5px;font-weight:500;
  background:var(--surface);color:var(--text-2);
  border:1px solid var(--border);
  transition:background .12s,border-color .12s,color .12s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip:hover{background:var(--surface-2);color:var(--text);}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
.chip.icon-only{padding:0;width:30px;justify-content:center;}
.font-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;}
.font-list::-webkit-scrollbar{height:0;}
.font-list .chip{font-size:14px;padding:0 14px;height:34px;}

.swatch-row{display:flex;gap:6px;flex-wrap:wrap;}
.swatch{
  width:26px;height:26px;border-radius:6px;
  border:1px solid rgba(0,0,0,.08);
  transition:transform .15s,box-shadow .15s;
}
.swatch:hover{transform:scale(1.08);}
.swatch.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent);}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
  background:var(--surface-3);flex:1;min-width:100px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--text);cursor:pointer;
  box-shadow:0 0 0 3px var(--surface);
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border:0;border-radius:50%;
  background:var(--text);cursor:pointer;
}
input[type=color]{
  width:30px;height:30px;border:1px solid var(--border-2);border-radius:7px;
  background:none;padding:2px;cursor:pointer;
}
textarea.text-area{
  width:100%;border:1px solid var(--border-2);background:var(--surface);
  border-radius:8px;padding:9px 12px;font-size:13.5px;
  resize:none;min-height:64px;line-height:1.5;
  transition:border-color .15s,box-shadow .15s;
}
textarea.text-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

.toolbar{
  display:flex;gap:2px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--border);
  flex:0 0 auto;justify-content:center;
}
.toolbar button{
  flex:1;max-width:88px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border-radius:8px;
  color:var(--text-2);font-size:10.5px;font-weight:500;
  transition:background .15s,color .15s;
}
.toolbar button:hover{background:var(--surface-2);color:var(--text);}
.toolbar button:active{background:var(--surface-3);}

/* ============ MODAL ============ */
#modalRoot{position:fixed;inset:0;display:none;z-index:60;}
#modalRoot.open{display:block;}
.modal-bg{
  position:absolute;inset:0;background:rgba(0,0,0,.4);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes modalUp{from{opacity:0;transform:translate(-50%,48%) scale(.96);}to{opacity:1;transform:translate(-50%,50%) scale(1);}}
.modal-card{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border-radius:16px 16px 0 0;
  padding:24px 24px calc(28px + env(safe-area-inset-bottom));
  border:1px solid var(--border);border-bottom:0;
  animation:sheetUp .3s cubic-bezier(.22,1,.36,1);
}
@media(min-width:640px){
  .modal-card{
    bottom:50%;transform:translate(-50%,50%);
    border-radius:14px;border-bottom:1px solid var(--border);
    animation:modalUp .3s cubic-bezier(.22,1,.36,1);
  }
}
.modal-title{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-0.015em;}
.modal-sub{margin:0 0 20px;font-size:13.5px;color:var(--text-2);line-height:1.55;}
.credit-box{
  border:1px solid var(--border-2);border-radius:10px;
  padding:18px;background:var(--surface-2);
}
.credit-box h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:-0.01em;}
.credit-box p{margin:0;font-size:13.5px;line-height:1.65;color:var(--text-2);}
.credit-note{
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text-3);display:flex;gap:6px;align-items:center;
}
.field{margin-bottom:14px;}
.field:last-of-type{margin-bottom:0;}
.field label{
  display:block;font-size:12px;font-weight:500;color:var(--text-2);
  margin-bottom:6px;
}
.field input,.field textarea{
  width:100%;border:1px solid var(--border-2);background:var(--surface);
  border-radius:8px;padding:9px 12px;font-size:14px;
  transition:border-color .15s,box-shadow .15s;resize:none;
}
.field input:focus,.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.field .hint{
  margin-top:4px;font-size:11.5px;color:var(--text-3);
  display:flex;justify-content:space-between;
}
.preview-thumb{
  width:100%;max-height:220px;object-fit:contain;
  border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);margin-bottom:18px;display:block;
}
.modal-actions{display:flex;gap:8px;margin-top:22px;}

/* ============ BANNER ============ */
#banner{
  position:fixed;top:calc(12px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%) translateY(-160%);
  z-index:120;max-width:520px;width:calc(100% - 24px);
  background:var(--surface);border:1px solid var(--border-2);

  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);

async function compressImage(file, maxBytes = MAX_BYTES, maxDim = 1600) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = url;
  });
  let dim = maxDim, blob = null;
  for (let pass = 0; pass < 8; pass++) {
    const s = Math.min(1, dim / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * s));
    c.height = Math.max(1, Math.round(img.naturalHeight * s));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    let q = 0.88;
    blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    while (blob && blob.size > maxBytes && q > 0.35) {
      q = Math.round((q - 0.07) * 100) / 100;
      blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    }
    if (blob && blob.size <= maxBytes) break;
    dim = Math.round(dim * 0.75);
  }
  URL.revokeObjectURL(url);
  return blob;
}

function onPointerDown(e) {
  if (state.screen !== "editor") return;
  const elDom = e.target.closest(".el");
  const handle = e.target.closest(".handle");
  if (elDom && handle) {
    e.preventDefault();
    const id = elDom.dataset.id;
    const dir = handle.dataset.dir;
    const el = getEl(id);
    if (!el) return;
    selectEl(id);
    const rect = stage.getBoundingClientRect();
    const px = (e.clientX - rect.left) / scale;
    const py = (e.clientY - rect.top) / scale;
    if (dir === "rot") {
      const cx = el.x + el.w / 2, cy = el.y + el.h / 2;
      dragState = { mode: "rotate", id, cx, cy, startAngle: Math.atan2(py - cy, px - cx) * 180 / Math.PI, rot0: el.rot || 0 };
    } else {
      dragState = { mode: "resize", id, dir, sx: e.clientX, sy: e.clientY, w0: el.w, h0: el.h, x0: el.x, y0: el.y };
    }
    return;
  }
  if (elDom) {
    e.preventDefault();
    const id = elDom.dataset.id;
    const el = getEl(id);
    if (!el) return;
    selectEl(id);
    el.z = ++state.elZ;
    syncDom(el);
    dragState = { mode: "drag", id, sx: e.clientX, sy: e.clientY, x0: el.x, y0: el.y };
    return;
  }
  selectEl(null);
}

function onPointerMove(e) {
  if (!dragState) return;
  const el = getEl(dragState.id);
  if (!el) { dragState = null; return; }
  e.preventDefault();

  if (dragState.mode === "drag") {
    el.x = dragState.x0 + (e.clientX - dragState.sx) / scale;
    el.y = dragState.y0 + (e.clientY - dragState.sy) / scale;
    syncDom(el); return;
  }
  if (dragState.mode === "rotate") {
    const rect = stage.getBoundingClientRect();
    const px = (e.clientX - rect.left) / scale;
    const py = (e.clientY - rect.top) / scale;
    const ang = Math.atan2(py - dragState.cy, px - dragState.cx) * 180 / Math.PI;
    let rot = dragState.rot0 + (ang - dragState.startAngle);
    while (rot > 180) rot -= 360;
    while (rot < -180) rot += 360;
    if (!e.shiftKey) {
      const snaps = [0, 90, -90, 180, -180, 45, -45, 135, -135];
      for (const s of snaps) { if (Math.abs(rot - s) < 4.5) { rot = s; break; } }
    } else rot = Math.round(rot / 15) * 15;
    el.rot = rot; syncDom(el); return;
  }
  if (dragState.mode === "resize") {
    const dir = dragState.dir;
    const sw = dir.includes("r") ? 1 : dir.includes("l") ? -1 : 0;
    const sh = dir.includes("b") ? 1 : dir.includes("t") ? -1 : 0;
    const dx = (e.clientX - dragState.sx) / scale;
    const dy = (e.clientY - dragState.sy) / scale;
    const th = (el.rot || 0) * Math.PI / 180;
    const cos = Math.cos(th), sin = Math.sin(th);
    const lx = dx * cos + dy * sin;
    const ly = -dx * sin + dy * cos;
    const MIN = 32;
    const oldW = dragState.w0, oldH = dragState.h0;
    const nw = Math.max(MIN, oldW + lx * sw);
    const nh = sh === 0 ? oldH : Math.max(MIN, oldH + ly * sh);
    const dw = nw - oldW, dh = nh - oldH;
    const cx = dragState.x0 + oldW / 2, cy = dragState.y0 + oldH / 2;
    const ox = dw * sw / 2, oy = dh * sh / 2;
    const ncx = cx + ox * cos - oy * sin;
    const ncy = cy + ox * sin + oy * cos;
    el.w = nw;
    if (sh !== 0) el.h = nh;
    el.x = ncx - nw / 2;
    el.y = ncy - (sh === 0 ? oldH : nh) / 2;
    syncDom(el); return;
  }
}
function onPointerUp() { if (!dragState) return; dragState = null; }

function wrapLines(ctx, text, maxW) {
  const out = [];
  const paras = String(text == null ? "" : text).split("\n");
  for (const para of paras) {
    const words = para.split(" ");
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width <= maxW) { line = test; continue; }
      if (!line) {
        let chunk = "";
        for (const ch of word) {
          if (chunk && ctx.measureText(chunk + ch).width > maxW) { out.push(chunk); chunk = ch; }
          else chunk += ch;
        }
        line = chunk;
      } else {
        out.push(line);
        if (ctx.measureText(word).width <= maxW) line = word;
        else {
          let chunk = "";
          for (const ch of word) {
            if (chunk && ctx.measureText(chunk + ch).width > maxW) { out.push(chunk); chunk = ch; }
            else chunk += ch;
          }
          line = chunk;
        }
      }
    }
    out.push(line);
  }
  return out;
}

async function renderToCanvas() {
  const { w: W, h: H } = dims();
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = state.bg;
  ctx.fillRect(0, 0, W, H);
  try { await document.fonts.ready; } catch (e) {}

  const sorted = state.elements.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
  for (const el of sorted) {
    ctx.save();
    ctx.globalAlpha = el.opacity == null ? 1 : el.opacity;
    const cx = el.x + el.w / 2, cy = el.y + el.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate((el.rot || 0) * Math.PI / 180);
    if (el.type === "image") {
      let img = el._img;
      if (!img || !img.complete) { try { img = await loadImg(el.src); el._img = img; } catch (e) { img = null; } }
      if (img) {
        if (el.radius > 0) { roundRectPath(ctx, -el.w / 2, -el.h / 2, el.w, el.h, el.radius); ctx.clip(); }
        ctx.drawImage(img, -el.w / 2, -el.h / 2, el.w, el.h);
      }
    } else {
      ctx.font = (el.italic ? "italic " : "") + el.weight + " " + el.size + "px '" + el.font + "', Inter, sans-serif";
      ctx.fillStyle = el.color;
      ctx.textBaseline = "middle";
      ctx.textAlign = el.align;
      const lines = wrapLines(ctx, el.text, el.w);
      const lh = el.size * 1.2;
      const total = Math.max(lh, lines.length * lh);
      const startY = -total / 2 + lh / 2;
      const tx = el.align === "center" ? 0 : el.align === "right" ? el.w / 2 : -el.w / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], tx, startY + i * lh);
    }
    ctx.restore();
  }
  return c;
}

    let sc = 0.85;
    while (sc > 0.3) {
      const c2 = document.createElement("canvas");
      c2.width = Math.round(canvas.width * sc);
      c2.height = Math.round(canvas.height * sc);
      const x = c2.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c2.width, c2.height);
      x.drawImage(canvas, 0, 0, c2.width, c2.height);
      const b2 = await new Promise(r => c2.toBlob(r, "image/jpeg", 0.82));
      if (b2 && b2.size <= maxBytes) return b2;
      sc -= 0.15;
    }
  }
  return blob;
}

async function exportImage() {
  const canvas = await renderToCanvas();
  const blob = await canvasToBlobUnder(canvas, MAX_BYTES);
  const dataUrl = await blobToDataURL(blob);
  if (dataUrl.length > MAX_DATAURL_LEN) throw new Error("TOO_LARGE");
  return { blob, dataUrl };
}

async function loadFeed() {
  const list = $("#feedList");
  list.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  if (!fbReady) {
    list.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">' + SVG.wifi + '</div>' +
        '<h3>Belum tersambung</h3>' +
        '<p>' + esc(fbError || "Menghubungkan ke server...") + '</p>' +
      '</div>';
    return;
  }
  try {
    const postsRef = dbRef(db, "posts");
    const q = dbQuery(postsRef, orderByChild("createdAt"), limitToLast(FEED_LIMIT));
    const snap = await dbGet(q);
    const arr = [];
    snap.forEach(child => {
      const v = child.val() || {};
      arr.push(Object.assign({ id: child.key }, v));
    });
    arr.reverse();
    state.posts = arr;
    renderFeed();
  } catch (e) {
    console.error("[Sharing-it] loadFeed error:", e);
    const msg = (e && e.message) || "";
    let inner;
    if (/permission|denied/i.test(msg)) {
      inner = '<div class="empty-icon">' + SVG.lock + '</div><h3>Akses ditolak</h3><p>Rules menolak permintaan. Periksa database.rules.json.</p>';
    } else if (/network|failed to fetch/i.test(msg)) {
      inner = '<div class="empty-icon">' + SVG.wifi + '</div><h3>Tidak ada koneksi</h3><p>Periksa jaringan internet kamu.</p>';
    } else {
      inner = '<div class="empty-icon">' + SVG.plain + '</div><h3>Gagal memuat</h3><p>' + esc(msg.slice(0, 120)) + '</p>';
    }
    list.innerHTML = '<div class="empty">' + inner + '</div>';
  }
}

function renderFeed() {
  const list = $("#feedList");
  if (!state.posts.length) {
    list.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">' + SVG.sparkle + '</div>' +
        '<h3>Belum ada karya</h3>' +
        '<p>Jadilah yang pertama memposting sesuatu di sini.</p>' +
      '</div>';
    return;
  }
  const uid = state.user ? state.user.uid : null;
  list.innerHTML = state.posts.map(p => {
    const likes = p.likes || {};
    const count = Object.keys(likes).length;
    const liked = uid && likes[uid];
    const initial = esc((p.author || "?").trim().charAt(0).toUpperCase() || "?");
    const open = state.expanded.has(p.id) ? " open" : "";
    return '<article class="post fade-in" data-post="' + p.id + '">' +
      '<div class="post-head">' +
        '<div class="avatar">' + initial + '</div>' +
        '<div class="post-info">' +
          '<div class="post-author">' + esc(p.author) + '</div>' +
          '<div class="post-time mono">' + timeAgo(p.createdAt) + '</div>' +
        '</div>' +
      '</div>' +
      (p.title ? '<h3 class="post-title">' + esc(p.title) + '</h3>' : '') +
      (p.description ? '<p class="post-desc">' + esc(p.description) + '</p>' : '') +
      '<img class="post-img" loading="lazy" src="' + esc(p.imageUrl) + '" alt="">' +
      '<div class="post-actions">' +
        '<button class="act like' + (liked ? " liked" : "") + '" data-like="' + p.id + '">' +
          SVG.heart + ' <span class="num" data-likes="' + p.id + '">' + count + '</span>' +
        '</button>' +
        '<button class="act" data-cmt="' + p.id + '">' +
          SVG.comment + ' <span class="num" data-count="' + p.id + '">0</span>' +
        '</button>' +
      '</div>' +
      '<div class="comments' + open + '" data-comments="' + p.id + '">' +
        '<div class="c-list" data-clist="' + p.id + '"></div>' +
        '<div class="c-form">' +
          '<input type="text" maxlength="300" placeholder="Tulis komentar..." data-cinput="' + p.id + '">' +
          '<button data-csend="' + p.id + '" aria-label="Kirim">' + SVG.send + '</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join("");

  state.posts.forEach(p => {
    countComments(p.id);
    if (state.expanded.has(p.id)) loadComments(p.id);
  });
}

async function countComments(id) {
  if (!fbReady) return;
  try {
    const snap = await dbGet(dbRef(db, "comments/" + id));
    let n = 0; snap.forEach(() => { n++; });
    const el = document.querySelector('[data-count="' + id + '"]');
    if (el) el.textContent = n;
  } catch (e) {
    const el = document.querySelector('[data-count="' + id + '"]');
    if (el) el.textContent = "0";
  }
}

async function loadComments(id) {
  const box = document.querySelector('[data-clist="' + id + '"]');
  if (!box) return;
  if (box.dataset.loaded === "1") return;
  box.innerHTML = '<div class="c-empty">Memuat...</div>';
  try {
    const snap = await dbGet(dbRef(db, "comments/" + id));
    const items = [];
    snap.forEach(child => items.push(child.val() || {}));
    items.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!items.length) {
      box.innerHTML = '<div class="c-empty">Belum ada komentar.</div>';
    } else {
      box.innerHTML = items.map(c =>
        '<div class="c-item">' +
          '<div class="c-ava">' + esc((c.author || "?").charAt(0).toUpperCase()) + '</div>' +
          '<div class="c-body"><span class="c-name">' + esc(c.author) + '</span>' + esc(c.text) + '</div>' +
        '</div>'
      ).join("");
    }
    box.dataset.loaded = "1";
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.innerHTML = '<div class="c-empty">Gagal memuat.</div>';
  }
}

async function doLike(id, btn) {
  if (!fbReady || !state.user) { toast("Menyambungkan..."); return; }
  const now = Date.now();
  if (now - state.lastLike < LIKE_CD) {
    toast("Tunggu " + Math.ceil((LIKE_CD - (now - state.lastLike)) / 1000) + " detik");
    return;
  }
  state.lastLike = now;
  const uid = state.user.uid;
  const likeRef = dbRef(db, "posts/" + id + "/likes/" + uid);
  const p = state.posts.find(x => x.id === id);
  const wasLiked = p && p.likes && p.likes[uid];
  if (p) {
    p.likes = p.likes || {};
    if (wasLiked) delete p.likes[uid];
    else p.likes[uid] = Date.now();
    btn.classList.toggle("liked", !wasLiked);
    const span = btn.querySelector("[data-likes]");
    if (span) span.textContent = Object.keys(p.likes).length;
  }
  try {
    if (wasLiked) await dbRemove(likeRef);
    else await dbSet(likeRef, Date.now());
  } catch (e) {
    console.error(e);
    toast("Gagal menyukai");
    if (p) {
      p.likes = p.likes || {};
      if (p.likes[uid]) delete p.likes[uid]; else p.likes[uid] = Date.now();
      const span = btn.querySelector("[data-likes]");
      if (span) span.textContent = Object.keys(p.likes).length;
      btn.classList.toggle("liked", !!p.likes[uid]);
    }
  }
}

async function sendComment(id) {
  if (!fbReady || !state.user) { toast("Menyambungkan..."); return; }
  const now = Date.now();
  if (now - state.lastComment < COMMENT_CD) {
    toast("Tunggu " + Math.ceil((COMMENT_CD - (now - state.lastComment)) / 1000) + " detik");
    return;
  }
  const input = document.querySelector('[data-cinput="' + id + '"]');
  const btn = document.querySelector('[data-csend="' + id + '"]');
  if (!input) return;
  const text = input.value.trim();
  if (!text) { toast("Komentar kosong"); return; }
  if (text.length > 300) { toast("Maks 300 karakter"); return; }
  state.lastComment = now;
  btn.disabled = true; input.disabled = true;
  try {
    const nick = await ensureNick();
    const newRef = dbPush(dbRef(db, "comments/" + id));
    await dbSet(newRef, { text, author: nick, uid: state.user.uid, createdAt: Date.now() });
    input.value = "";
    const box = document.querySelector('[data-clist="' + id + '"]');
    if (box) box.dataset.loaded = "0";
    await loadComments(id); countComments(id);
    const list = document.querySelector('[data-clist="' + id + '"]');
    if (list) list.scrollTop = list.scrollHeight;
  } catch (e) {
    console.error(e);
    toast("Gagal mengirim komentar");
  } finally {
    btn.disabled = false; input.disabled = false; input.focus();
  }
}

function ensureNick() {
  return new Promise(resolve => {
    if (state.nick && state.nick.trim()) { resolve(state.nick.trim()); return; }
    openModal(
      '<h2 class="modal-title">Nama tampilan</h2>' +
      '<p class="modal-sub">Nama ini akan muncul di setiap postingan dan komentar kamu. Bisa diganti kapan saja saat memposting.</p>' +
      '<div class="field"><label>Nama</label><input id="nickInput" maxlength="24" placeholder="contoh: Bunga" autocomplete="off"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-primary btn-wide" id="nickSave">Simpan</button>' +
      '</div>'
    );
    const inp = $("#nickInput");
    setTimeout(() => inp.focus(), 200);
    const save = () => {
      const v = inp.value.trim().slice(0, 24);
      if (!v) { toast("Nama tidak boleh kosong"); return; }
      state.nick = v; localStorage.setItem("sharingit_nick", v);
      closeModal(); resolve(v);
    };
    $("#nickSave").addEventListener("click", save);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
  });
}

async function doPost() {
  if (state.posting) return;
  if (!fbReady || !state.user) { toast("Menyambungkan ke server..."); return; }
  if (!state.elements.length) { toast("Tambahkan minimal 1 elemen"); return; }

  $("#edPublish").disabled = true;
  loading(true);
  let dataUrl = "";
  try {
    const r = await exportImage();
    dataUrl = r.dataUrl;
  } catch (e) {
    console.error(e);
    loading(false); $("#edPublish").disabled = false;
    toast(e.message === "TOO_LARGE" ? "Karya terlalu besar. Kurangi foto atau teks." : "Gagal membuat gambar", 3200);
    return;
  }
  loading(false);
  $("#edPublish").disabled = false;

  const nick = await ensureNick();
  const sizeKB = Math.round(dataUrl.length / 1024);

  openModal(
    '<h2 class="modal-title">Publikasikan</h2>' +
    '<p class="modal-sub">Karya akan tampil publik di feed. Ukuran akhir: <span class="mono">' + sizeKB + ' KB</span></p>' +
    '<img class="preview-thumb" src="' + dataUrl + '" alt="">' +
    '<div class="field"><label>Judul</label><input id="pTitle" maxlength="80" placeholder="Kasih judul..." autocomplete="off"></div>' +
    '<div class="field"><label>Deskripsi <span style="color:var(--text-3);font-weight:400">opsional</span></label><textarea id="pDesc" maxlength="500" rows="3" placeholder="Cerita singkat tentang karya ini..."></textarea></div>' +
    '<div class="field"><label>Nama</label><input id="pAuthor" maxlength="24" value="' + esc(nick) + '" autocomplete="off"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-outline" id="pubCancel" style="flex:1">Batal</button>' +
      '<button class="btn btn-primary" id="pubGo" style="flex:1.5">Publikasikan</button>' +
    '</div>'
  );
  setTimeout(() => $("#pTitle").focus(), 200);
  $("#pubCancel").addEventListener("click", closeModal);
  $("#pubGo").addEventListener("click", async () => {
    const title = $("#pTitle").value.trim().slice(0, 80);
    const description = $("#pDesc").value.trim().slice(0, 500);
    const author = $("#pAuthor").value.trim().slice(0, 24) || "Anonim";
    if (!title) { toast("Judul wajib diisi"); return; }
    state.nick = author; localStorage.setItem("sharingit_nick", author);
    state.posting = true;
    $("#pubGo").disabled = true;
    loading(true);
    try {
      const uid = state.user.uid;
      const newRef = dbPush(dbRef(db, "posts"));
      await dbSet(newRef, {
        title, description, author, uid,
        imageUrl: dataUrl, createdAt: Date.now()
      });
      closeModal();
      loading(false);
      state.posting = false;
      resetEditor();
      go("feed");
      toast("Karya terpublikasi.");
    } catch (e) {
      console.error(e);
      loading(false); state.posting = false;
      $("#pubGo").disabled = false;
      const msg = (e && e.message) || "";
      if (/permission|denied/i.test(msg)) toast("Ditolak rules. Cek database.rules.json", 3800);
      else if (/too large|exceeds/i.test(msg)) toast("Karya terlalu besar untuk Firebase.", 3200);
      else toast("Gagal memposting. Coba lagi.", 3000);
    }
  });
}

/* ============ PWA ============ */
function makeIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  const theme = state.theme;
  const bgs = { mono: "#171717", pink: "#be185d", sky: "#0369a1" };
  x.fillStyle = bgs[theme] || "#171717";
  roundRectPath(x, 0, 0, size, size, size * 0.22);
  x.fill();
  const p = size * 0.26;
  const r = size * 0.11;
  x.strokeStyle = "#ffffff";
  x.lineWidth = size * 0.055;
  x.lineJoin = "round";
  roundRectPath(x, p, p, size - p * 2, size - p * 2, r);
  x.stroke();
  x.fillStyle = "#ffffff";
  x.beginPath();
  x.arc(size * 0.4, size * 0.4, size * 0.055, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.moveTo(size * 0.3, size * 0.68);
  x.lineTo(size * 0.46, size * 0.48);
  x.lineTo(size * 0.58, size * 0.68);
  x.closePath();
  x.fill();
  return c.toDataURL("image/png");
}

function setupPWA() {
  const icon192 = makeIcon(192);
  const icon512 = makeIcon(512);
  const fav = document.createElement("link");
  fav.rel = "icon";
  fav.href = icon192;
  document.head.appendChild(fav);
  const apple = document.createElement("link");
  apple.rel = "apple-touch-icon";
  apple.href = icon192;
  document.head.appendChild(apple);
  const scope = location.href.replace(/[^/]*$/, "");
  const manifest = {
    name: "Sharing-it",
    short_name: "Sharing-it",
    description: "Editor foto ringan dengan feed publik.",
    start_url: location.href,
    scope: scope,
    display: "standalone",
    orientation: "any",
    background_color: "#fafafa",
    theme_color: "#fafafa",
    icons: [
      { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
}

/* ============ FIREBASE ============ */
const CONSOLE_AUTH_URL = "https://console.firebase.google.com/project/sharing-it-f9e36/authentication/providers";
const CONSOLE_RTDB_URL = "https://console.firebase.google.com/project/sharing-it-f9e36/database/sharing-it-f9e36-default-rtdb/rules";

async function initFirebase() {
  try {
    if (!app) {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getDatabase(app);
      onAuthStateChanged(auth, u => { if (u) state.user = u; });
    }
    const cred = await signInAnonymously(auth);
    state.user = cred.user;
    fbReady = true;
    fbError = "";
    hideBanner();
    return true;
  } catch (e) {
    fbReady = false;
    const code = (e && e.code) || "";
    const msg = (e && e.message) || "";
    console.error("[Sharing-it] Firebase init error:", code, msg);

    if (code === "auth/admin-restricted-operation") {
      fbError = "Anonymous sign-in belum diaktifkan di project Firebase ini.";
      showBanner({
        icon: SVG.lock,
        title: "Aktifkan Anonymous sign-in",
        msg: "Firebase menolak login anonim. Buka Firebase Console → Authentication → Sign-in method, lalu aktifkan provider Anonymous. Setelah itu refresh halaman ini.",
        actions: [{ label: "Buka Firebase Console", href: CONSOLE_AUTH_URL }],
        buttons: [{ label: "Sudah aktif, coba lagi", onClick: async () => { hideBanner(); await initFirebase(); if (state.screen === "feed") loadFeed(); } }]
      });
    } else if (code === "auth/operation-not-allowed") {
      fbError = "Provider sign-in dinonaktifkan.";
      showBanner({
        icon: SVG.lock,
        title: "Provider dinonaktifkan",
        msg: "Aktifkan provider Anonymous di Firebase Console → Authentication → Sign-in method.",
        actions: [{ label: "Buka Firebase Console", href: CONSOLE_AUTH_URL }]
      });
    } else if (code === "auth/network-request-failed") {
      fbError = "Tidak ada koneksi internet.";
      showBanner({
        icon: SVG.wifi,
        title: "Koneksi gagal",
        msg: "Periksa jaringan internet lalu coba lagi.",
        buttons: [{ label: "Coba lagi", onClick: async () => { hideBanner(); await initFirebase(); } }]
      });
    } else if (code === "auth/invalid-api-key" || code === "auth/configuration-not-found") {
      fbError = "Konfigurasi Firebase tidak valid.";
      showBanner({
        icon: SVG.alert,
        title: "Konfigurasi salah",
        msg: "Periksa firebaseConfig (apiKey, authDomain, databaseURL).",
      });
    } else if (/database/i.test(msg) || code === "database/invalid-url") {
      fbError = "databaseURL salah atau database belum dibuat.";
      showBanner({
        icon: SVG.alert,
        title: "Realtime Database belum siap",
        msg: "Buat Realtime Database di Firebase Console, lalu copy URL-nya ke firebaseConfig.databaseURL.",
        actions: [{ label: "Buka Realtime Database", href: "https://console.firebase.google.com/project/sharing-it-f9e36/database" }]
      });
    } else {
      fbError = msg || "Gagal menyambung ke Firebase.";
      showBanner({
        icon: SVG.alert,
        title: "Gagal menyambung",
        msg: (msg || "Unknown error").slice(0, 160),
        buttons: [{ label: "Coba lagi", onClick: async () => { hideBanner(); await initFirebase(); } }]
      });
    }
    return false;
  }
}

/* ============ BOOT ============ */
function boot() {
  setTheme(state.theme);
  setupPWA();
  fitStage();
  renderPanel();
  initFirebase().then(() => {
    if (state.screen === "feed") loadFeed();
  });
}

boot();
</script>
