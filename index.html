<style>
:root{--bg:#fafafa;--sf:#fff;--s2:#f3f3f3;--s3:#e6e6e6;--tx:#171717;--t2:#525252;--t3:#9a9a9a;--bd:#e5e5e5;--b2:#d2d2d2;--ac:#171717;--af:#fff;--as:#efefef;--dg:#dc2626;--sel:#2f7cf6;--sh:0 10px 30px rgba(0,0,0,.14);--s:1}

[data-theme=sky]{--bg:#f6fafe;--s2:#eef6fc;--s3:#dcecf8;--tx:#0f2b42;--t2:#3d5a75;--t3:#8ba3b8;--bd:#d9e8f3;--b2:#bcd4e6;--ac:#0369a1;--as:#e4f0fa}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}input,textarea{background:none;border:0;outline:0}
.i{flex:none;vertical-align:middle}
.scr{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}.scr.on{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}.btn:active{transform:scale(.98)}
.pr{background:var(--ac);color:var(--af)}.ou{border:1px solid var(--b2);background:var(--sf)}.gh{color:var(--t2);height:36px}.w{width:100%}
.home{margin:auto;width:100%;max-width:520px;height:100%;padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{width:34px;height:34px;border-radius:9px;background:var(--ac);color:var(--af);display:grid;place-items:center}
h1{font-size:36px;line-height:1.1;letter-spacing:-.03em;margin:28px 0 12px;max-width:14ch}.home p{color:var(--t2);font-size:15px;max-width:38ch;margin:0}
.col{display:flex;flex-direction:column;gap:8px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:14px;border-top:1px solid var(--bd);color:var(--t3);font-size:12px}
.dots{display:flex;gap:8px}.dot{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 1px var(--b2)}.dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}

.pi{flex:1;min-width:0}.pi b{display:block;font-size:13px}.pi small{color:var(--t3);font-size:11px}
.post h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}.post .d{margin:0 0 12px;color:var(--t2);white-space:pre-wrap;word-break:break-word}.post img{width:100%;display:block;border-radius:10px;background:var(--s2)}

.empty{text-align:center;padding:56px 20px;color:var(--t3)}
.eb{flex:1;min-height:0;display:flex;flex-direction:column}

#so{position:relative;box-shadow:var(--sh)}#stg{position:absolute;top:0;left:0;transform-origin:0 0;overflow:hidden}
.el{position:absolute;transform-origin:center;touch-action:none;cursor:move;user-select:none}
.el .in{display:block;width:100%;height:100%;pointer-events:none;box-sizing:border-box}.el img.in{object-fit:cover}.el .t{height:auto;white-space:pre-wrap;line-height:1.2;overflow-wrap:anywhere}
.el.sel{outline:calc(2px/var(--s)) solid var(--sel)}
.hd{position:absolute;display:none;width:calc(20px/var(--s));height:calc(20px/var(--s));background:#fff;border:calc(2px/var(--s)) solid var(--sel);border-radius:50%;transform:translate(-50%,-50%);touch-action:none}.el.sel .hd{display:block}
.h-tl{left:0;top:0;cursor:nwse-resize}.h-tr{left:100%;top:0;cursor:nesw-resize}.h-bl{left:0;top:100%;cursor:nesw-resize}.h-br{left:100%;top:100%;cursor:nwse-resize}.h-l{left:0;top:50%;cursor:ew-resize}.h-r{left:100%;top:50%;cursor:ew-resize}
.h-rot{left:50%;top:calc(-36px/var(--s));cursor:grab}.h-rot::after{content:"";position:absolute;left:50%;top:100%;width:calc(2px/var(--s));height:calc(26px/var(--s));background:var(--sel);transform:translateX(-50%)}
.gd{position:absolute;background:#ec4899;display:none;pointer-events:none;z-index:9999}#gv{left:50%;top:0;bottom:0;width:calc(2px/var(--s))}#gh{top:50%;left:0;right:0;height:calc(2px/var(--s))}
#pn{max-height:40vh;overflow-y:auto;padding:14px 16px;background:var(--sf);border-top:1px solid var(--bd);flex:none}.in2{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.sl{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--t2);margin-bottom:6px}.sl span{width:84px;flex:none}.sl b{width:44px;text-align:right;font-weight:500;color:var(--t3);font-size:11px}
input[type=range]{flex:1;min-width:0;height:4px;-webkit-appearance:none;appearance:none;background:var(--s3);border-radius:9px}

input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ac);border:2px solid var(--sf)}
.ta,.fd input,.fd textarea{width:100%;border:1px solid var(--b2);background:var(--sf);border-radius:9px;padding:9px 12px;resize:none}.ta:focus,.fd input:focus,.fd textarea:focus,.cf input:focus{border-color:var(--ac)}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}.emo button{font-size:26px;height:44px;border-radius:8px}.emo button:hover{background:var(--s2)}
.tb{display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--bd);flex:none}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:9px;color:var(--t2);font-size:10.5px;font-weight:500}.tb button:hover,.tb button.on{background:var(--s2);color:var(--tx)}
#md{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}#md.on{display:flex}
#mc{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--sf);border-radius:18px 18px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));animation:up .25s}
@media(min-width:640px){#md{align-items:center}#mc{border-radius:16px}}@keyframes up{from{transform:translateY(40px);opacity:0}}
#mc h2{margin:0 0 12px;font-size:18px}#mc p{color:var(--t2);margin:0 0 12px}.pv{width:100%;max-height:220px;object-fit:contain;background:var(--s2);border-radius:10px;margin-bottom:14px}
.fd{margin-bottom:12px}.fd label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px}.r2{display:flex;gap:8px;margin-top:16px}.r2 .btn{flex:1}
#ts{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:88vw;text-align:center}#ts.on{opacity:1;transform:translate(-50%,0)}
#ld{position:fixed;inset:0;display:none;place-items:center;background:rgba(128,128,128,.25);z-index:100}#ld.on{display:grid}.spn{width:26px;height:26px;border-radius:50%;border:3px solid var(--b2);border-top-color:var(--ac);animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="scr on" id="s-home"><div class="home">
  <div><div class="brand"><span class="mark" data-ic="img"></span>Sharing-it</div>
  <h1>Edit foto, tambah teks, posting.</h1><p>Editor ringan untuk bikin karya cepat. Tanpa akun, tanpa ribet — buka, buat, bagikan.</p></div>
  <div><div class="col"><button class="btn pr w" id="bNew">Buat karya baru</button><button class="btn ou w" id="bFeed">Buka Feed</button><button class="btn gh w" id="bAbout">Tentang</button></div>
  <div class="meta"><span id="thl">tema: mono</span><div class="dots">
    <button class="dot" data-th="mono" style="background:#171717" aria-label="Mono"></button><button class="dot" data-th="pink" style="background:#be185d" aria-label="Pink"></button><button class="dot" data-th="sky" style="background:#0369a1" aria-label="Biru"></button><button class="dot" data-th="dark" style="background:linear-gradient(90deg,#0e0e10 50%,#fff 50%)" aria-label="Gelap"></button></div></div></div>
</div></section>

<section class="scr" id="s-feed">
  <div class="top"><button class="ib" id="fBack" data-ic="back" aria-label="Kembali"></button><h2>Feed</h2><button class="ib" id="fTheme" data-ic="sun" aria-label="Ganti tema"></button></div>
  <div class="fh"><span class="lv"><span id="dot"></span><span id="fl">Memuat…</span></span><button class="btn pr" id="fNew" style="height:36px;font-size:13px">Buat</button></div>
  <div class="fs" id="fs"><div id="feed"></div></div>
</section>

<section class="scr" id="s-editor">
  <div class="top"><button class="ib" id="eBack" data-ic="x" aria-label="Tutup"></button><button class="ib" id="eUndo" data-ic="undo" aria-label="Urungkan"></button><button class="ib" id="eRedo" data-ic="redo" aria-label="Ulangi"></button><h2>Editor</h2><button class="ib" id="eDl" data-ic="dl" aria-label="Unduh PNG"></button><button class="ib ac" id="ePub" data-ic="check" aria-label="Posting"></button></div>
  <div class="eb">
    <div id="sw"><div id="so"><div id="stg"><i class="gd" id="gv"></i><i class="gd" id="gh"></i></div></div></div>
    <div id="pn"></div>
    <div class="tb"><button data-t="photo"><span data-ic="img"></span>Foto</button><button data-t="text"><span data-ic="type"></span>Teks</button><button data-t="shp"><span data-ic="shape"></span>Bentuk</button><button data-t="stk"><span data-ic="smile"></span>Stiker</button><button data-t="cv" class="on"><span data-ic="cv"></span>Kanvas</button></div>
  </div>
</section>

<div id="md"><div id="mc"></div></div><div id="ts"></div><div id="ld"><div class="spn"></div></div>
<input type="file" id="fi" accept="image/*" hidden>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const rid=()=>Math.random().toString(36).slice(2,9),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const I={back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',undo:'<path d="M3 7v6h6M3 13a9 9 0 0 1 15-6.7L21 9"/>',redo:'<path d="M21 7v6h-6M21 13a9 9 0 0 0-15-6.7L3 9"/>',check:'<path d="M5 12l5 5L20 7"/>',dl:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',type:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',shape:'<rect x="3" y="11" width="10" height="10" rx="1"/><circle cx="16" cy="8" r="5"/>',smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',cv:'<rect x="3" y="5" width="18" height="14" rx="2"/>',heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',dn:'<path d="M12 5v14M19 12l-7 7-7-7"/>',ctr:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>'};
const ic=(n,z=18)=>`<svg class="i" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

const RATIOS={'1:1':[1080,1080],'4:5':[1080,1350],'3:2':[1080,720],'16:9':[1080,608],'9:16':[1080,1920]};
const FONTS=['Inter','Playfair Display','DM Serif Display','Lora','Space Grotesk','Bebas Neue','Caveat','JetBrains Mono'];
const COL=['#171717','#ffffff','#a3a3a3','#be185d','#0369a1','#15803d','#ca8a04','#7e22ce','#dc2626','#ea580c'];
const BGS=['#ffffff','#f5f5f5','#fdf2f8','#eff6ff','#fef9c3','#f0fdf4','#171717','#1e293b'];
const GRADS=[['#fda4af','#fdba74'],['#a5b4fc','#f0abfc'],['#6ee7b7','#7dd3fc'],['#0f172a','#475569'],['#f97316','#db2777']];
const EMO='😀😍🥳😎🤩😂🥹🔥✨💖⭐🌈🌸🍀🎉🎈👑💯📍☀️🌙🐱🐶🦋🍕☕🎵💡❤️👍🙌'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
const SHAPES={rect:['Persegi',.5,.5,0],round:['Rounded',.5,.5,60],circle:['Lingkaran',.5,.5,9999],line:['Garis',.6,.012,0]};
const FD={br:100,co:100,sa:100,bl:0,gr:0,se:0};
const PRE={'Asli':{},'Hitam putih':{gr:100},'Sepia':{se:80},'Vivid':{sa:160,co:115},'Pudar':{co:85,br:110,sa:80},'Hangat':{se:30,sa:125,br:105},'Dramatis':{br:85,co:135,sa:90}};
const THEMES=['mono','pink','sky','dark'],TC={mono:'#fafafa',pink:'#fdf7fa',sky:'#f6fafe',dark:'#0e0e10'};
const MAX=700*1024;

const S={nick:LS.get('si_nick')||'',user:null,scr:'home',tool:'cv',els:[],sel:null,ratio:'1:1',bg:{a:'#ffffff',b:''},hist:[],fut:[],posts:[],open:new Set(),lim:8,lastLike:0,lastCmt:0,key:''};
let K=1,drag=null;const map=new Map(),stg=$('#stg'),SW=$('#sw'),P=$('#pn');
const dims=()=>{const r=RATIOS[S.ratio];return{w:r[0],h:r[1]}};
const cur=()=>S.els.find(e=>e.id===S.sel),get=id=>S.els.find(e=>e.id===id);

function toast(m,t=2200){const e=$('#ts');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),t)}
const ld=on=>$('#ld').classList.toggle('on',!!on);
const modal=h=>{$('#mc').innerHTML=h;$('#md').classList.add('on')},closeM=()=>$('#md').classList.remove('on');
function setTheme(t){document.documentElement.dataset.theme=t;LS.set('si_theme',t);$('meta[name=theme-color]').content=TC[t];$$('.dot').forEach(d=>d.classList.toggle('on',d.dataset.th===t));$('#thl').textContent='tema: '+t}
const theme=()=>document.documentElement.dataset.theme;
function go(n){const was=S.scr;S.scr=n;$$('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));
  if(n==='feed')feedOn();else if(was==='feed')feedOff();
  if(n==='editor')requestAnimationFrame(()=>{fit();panel()})}

/* ===== history ===== */
const ent=()=>({els:S.els.map(e=>({...e})),bg:{...S.bg}}),sg=e=>JSON.stringify([e.els.map(x=>({...x,src:0})),e.bg]);
function snap(){const e=ent();e.sig=sg(e);const l=S.hist[S.hist.length-1];if(l&&sg(l)===e.sig)return;S.hist.push(e);if(S.hist.length>40)S.hist.shift();S.fut=[]}

function feedOff(){unsub&&unsub();unsub=null;cu.forEach(f=>f());cu.clear();S.key='';$('#dot').classList.remove('on')}
function listen(){unsub&&unsub();const{D,db}=fb;
  unsub=D.onValue(D.query(D.ref(db,'posts'),D.orderByChild('createdAt'),D.limitToLast(S.lim)),s=>{const a=[];s.forEach(c=>{a.push({id:c.key,...c.val()})});a.reverse();S.posts=a;
    $('#fl').textContent='Live · '+a.length+' karya';$('#dot').classList.add('on');const u=S.user.uid,k=a.map(p=>p.id+':'+Object.keys(p.likes||{}).length+':'+((p.likes||{})[u]?1:0)).join('|')+S.lim;if(k!==S.key){S.key=k;render()}},
    e=>{fbErr=e.message||'';feedMsg()})}
const ago=t=>{if(!t)return'baru saja';const s=(Date.now()-t)/1e3|0;return s<60?'baru saja':s<3600?(s/60|0)+' mnt':s<86400?(s/3600|0)+' jam':s<604800?(s/86400|0)+' hr':new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'})};
function render(){const L=$('#feed'),sc=$('#fs'),top=sc.scrollTop,inp={};cu.forEach(f=>f());cu.clear();$$('[data-ci]').forEach(i=>{if(i.value)inp[i.dataset.ci]=i.value});
  if(!S.posts.length){L.innerHTML='<div class="empty"><b>Belum ada karya</b><br>Jadilah yang pertama memposting.</div>';return}
  const u=S.user?.uid;
  L.innerHTML=S.posts.map(p=>{const lk=p.likes||{},n=Object.keys(lk).length;return`<article class="post"><div class="ph"><div class="av">${esc((p.author||'?').trim().charAt(0).toUpperCase())}</div><div class="pi"><b>${esc(p.author)}</b><small>${ago(p.createdAt)}</small></div>${u&&p.uid===u?`<button class="ib" data-del="${p.id}" aria-label="Hapus">${ic('trash',16)}</button>`:''}</div>${p.title?`<h3>${esc(p.title)}</h3>`:''}${p.description?`<p class="d">${esc(p.description)}</p>`:''}<img loading="lazy" src="${esc(p.imageUrl)}" alt="">
    <div class="pa"><button class="act${lk[u]?' lk':''}" data-like="${p.id}">${ic('heart',16)}<span data-ln="${p.id}">${n}</span></button><button class="act" data-cmt="${p.id}">${ic('msg',16)}<span data-cn="${p.id}"></span></button></div>
    <div class="cm${S.open.has(p.id)?' on':''}" data-c="${p.id}"><div class="cl" data-cl="${p.id}"></div><div class="cf"><input data-ci="${p.id}" maxlength="300" placeholder="Tulis komentar…"><button class="ib ac" data-send="${p.id}" aria-label="Kirim">${ic('send',15)}</button></div></div></article>`}).join('')
    +(S.posts.length>=S.lim?'<button class="btn ou w" id="more">Muat lebih banyak</button>':'');
  Object.keys(inp).forEach(id=>{const i=$(`[data-ci="${id}"]`);if(i)i.value=inp[id]});S.open.forEach(id=>cmtListen(id));sc.scrollTop=top}
function cmtListen(id){if(!fb)return;cu.get(id)&&cu.get(id)();const{D,db}=fb;
  cu.set(id,D.onValue(D.query(D.ref(db,'comments/'+id),D.orderByChild('createdAt'),D.limitToLast(100)),s=>{const a=[];s.forEach(c=>{a.push(c.val()||{})});a.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
    const b=$(`[data-cl="${id}"]`);if(!b)return;const bot=b.scrollHeight-b.scrollTop-b.clientHeight<40;b.innerHTML=a.length?a.map(c=>`<div><b>${esc(c.author)}</b>${esc(c.text)}</div>`).join(''):'<div style="color:var(--t3)">Belum ada komentar.</div>';
    $(`[data-cn="${id}"]`).textContent=a.length;if(bot)b.scrollTop=b.scrollHeight},()=>{const b=$(`[data-cl="${id}"]`);if(b)b.textContent='Gagal memuat komentar.'}))}
function toggleC(id){const o=S.open.has(id);o?(S.open.delete(id),cu.get(id)&&cu.get(id)(),cu.delete(id)):(S.open.add(id),cmtListen(id));$(`[data-c="${id}"]`).classList.toggle('on',!o)}
async function like(id,b){if(!fb||!S.user)return toast('Menyambungkan…');const n=Date.now();if(n-S.lastLike<1200)return toast('Pelan-pelan ya');S.lastLike=n;
  const{D,db}=fb,u=S.user.uid,p=S.posts.find(x=>x.id===id),was=p&&p.likes&&p.likes[u],r=D.ref(db,`posts/${id}/likes/${u}`);
  if(p){p.likes=p.likes||{};was?delete p.likes[u]:p.likes[u]=n;b.classList.toggle('lk',!was);$(`[data-ln="${id}"]`).textContent=Object.keys(p.likes).length}
  try{was?await D.remove(r):await D.set(r,n)}catch(e){console.error(e);toast('Gagal menyukai');S.key=''}}
const nick=()=>new Promise(r=>{if(S.nick)return r(S.nick);modal('<h2>Nama tampilan</h2><p>Nama ini muncul di postingan dan komentarmu.</p><div class="fd"><input id="ni" maxlength="24" placeholder="contoh: Bunga"></div><div class="r2"><button class="btn ou" id="nc">Batal</button><button class="btn pr" id="ns">Simpan</button></div>');
  $('#nc').onclick=()=>{closeM();r(null)};$('#ns').onclick=()=>{const v=$('#ni').value.trim().slice(0,24);if(!v)return toast('Nama wajib diisi');S.nick=v;LS.set('si_nick',v);closeM();r(v)}});
async function sendC(id){if(!fb||!S.user)return toast('Menyambungkan…');const n=Date.now();if(n-S.lastCmt<5000)return toast('Tunggu '+Math.ceil((5000-(n-S.lastCmt))/1000)+' detik');
  const i=$(`[data-ci="${id}"]`),t=i.value.trim();if(!t)return toast('Komentar kosong');const nm=await nick();if(!nm)return;S.lastCmt=n;
  try{const{D,db}=fb;await D.set(D.push(D.ref(db,'comments/'+id)),{text:t.slice(0,300),author:nm,uid:S.user.uid,createdAt:Date.now()});i.value=''}catch(e){console.error(e);toast('Gagal mengirim komentar')}}
async function delPost(id){if(!confirm('Hapus postingan ini?'))return;try{await fb.D.remove(fb.D.ref(fb.db,'posts/'+id))}catch(e){toast('Gagal menghapus')}}
$('#feed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.like)like(d.like,b);else if(d.cmt)toggleC(d.cmt);else if(d.send)sendC(d.send);else if(d.del)delPost(d.del);else if(b.id==='more'){S.lim+=8;listen()}});
$('#feed').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.ci)sendC(e.target.dataset.ci)});

/* ===== init & bind ===== */
$$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,e.classList.contains('mark')?20:20));
$$('.dot').forEach(d=>d.onclick=()=>setTheme(d.dataset.th));
$('#fTheme').onclick=()=>setTheme(THEMES[(THEMES.indexOf(theme())+1)%THEMES.length]);
$('#bNew').onclick=()=>{newDoc();go('editor')};$('#bFeed').onclick=()=>go('feed');$('#fBack').onclick=()=>go('home');$('#fNew').onclick=()=>go('editor');
$('#bAbout').onclick=()=>{modal('<h2>Sharing-it</h2><p>Editor foto ringan dengan feed publik. Tambah foto, teks, bentuk, dan stiker, atur filter, lalu unduh atau posting. Tanpa akun — kamu masuk sebagai pengguna anonim.</p><div class="r2"><button class="btn pr" id="mx">Tutup</button></div>');$('#mx').onclick=closeM};
$('#md').addEventListener('pointerdown',e=>{if(e.target.id==='md'&&!$('#ni'))closeM()});
$('#eBack').onclick=()=>{if(!S.els.length||confirm('Tinggalkan editor? Desain tetap tersimpan sampai halaman ditutup.'))go('feed')};
$('#eUndo').onclick=undo;$('#eRedo').onclick=redo;$('#eDl').onclick=dl;$('#ePub').onclick=pub;
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)addPhoto(f)};
$('.tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;if(t==='photo')return $('#fi').click();if(t==='text')return addText();
  S.tool=t;$$('.tb button').forEach(x=>x.classList.toggle('on',x===b));pick(null)});
setTheme(THEMES.includes(LS.get('si_theme'))?LS.get('si_theme'):'mono');
initFb();
</script>
</body>
</html>
